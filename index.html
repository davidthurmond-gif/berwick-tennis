    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      --navy-mid:    #161b22;
      --navy-light:  #1c2128;
      --navy-border: #30363d;
      --green:       #3fb950;
      --green-dark:  #2ea043;
      --green-light: #0d2a0d;
      --green-mid:   #56d364;
      --white:       #1c2128;
      --gray:        #8b949e;
      --gray-light:  #21262d;
      --gray-border: #30363d;
      --gold:        #d4a017;
      --red:         #f85149;
      --red-light:   #3d1a1a;
      --blue:        #58a6ff;
      --blue-light:  #0d2a4a;
      --shadow:      0 1px 4px rgba(0,0,0,0.4);
      --shadow-md:   0 4px 16px rgba(0,0,0,0.5);
      --radius:      10px;
      --radius-sm:   6px;

    .card { background: var(--navy-light); border:1px solid var(--navy-border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px; }
    .btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:var(--radius-sm); font-size:14px; font-weight:700; cursor:pointer; border:none; transition:all 0.15s; }
    .btn-primary { background:#238636; color:white; border:1px solid #2ea043; }
    .btn-primary:hover { background:#2ea043; }
    .btn-green { background:#238636; color:white; border:1px solid #2ea043; }
    .btn-green:hover { background:#2ea043; }
    .btn-secondary { background:var(--gray-light); color:#c9d1d9; border:1px solid var(--gray-border); }
    .btn-secondary:hover { background:#30363d; }
    .btn-danger { background:#6e1a1a; color:#f85149; border:1px solid #f85149; }
    .btn-danger:hover { background:#8b2020; }
    .btn-sm { padding:5px 10px; font-size:12px; }
    input, select, textarea { width:100%; padding:8px 12px; border:1px solid var(--gray-border); border-radius:var(--radius-sm); font-size:14px; outline:none; transition:border 0.15s; background:#0d1117; color:#e6edf3; }
    input:focus, select:focus, textarea:focus { border-color:var(--green); box-shadow:0 0 0 3px rgba(63,185,80,0.15); }
    label { display:block; font-size:13px; font-weight:700; color:#c9d1d9; margin-bottom:4px; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th { text-align:left; padding:8px 10px; background:#0d1117; font-size:11px; font-weight:800; color:#8b949e; text-transform:uppercase; letter-spacing:0.06em; border-bottom:2px solid var(--navy-border); }
    td { padding:10px 10px; border-bottom:1px solid var(--navy-border); color:#e6edf3; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:#21262d; }
    .badge { display:inline-flex; align-items:center; padding:2px 8px; border-radius:99px; font-size:11px; font-weight:800; }
    .badge-green { background:#0d3d0d; color:#3fb950; }
    .badge-navy { background:#21262d; color:#8b949e; }
    .badge-gold { background:#2d1e00; color:#d4a017; }
    .badge-red { background:#3d1a1a; color:#f85149; }
    .badge-gray { background:#21262d; color:#8b949e; }
    .badge-blue { background:#0d2a4a; color:#58a6ff; }
    .tab-bar { display:flex; gap:4px; overflow-x:auto; padding:0 12px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
    .tab-bar::-webkit-scrollbar { display:none; }
    .tab { padding:7px 13px; border-radius:var(--radius-sm); font-size:13px; font-weight:700; cursor:pointer; color:#8b949e; white-space:nowrap; border:none; background:transparent; transition:all 0.15s; }
    .tab.active { background:#161b22; color:#3fb950; border:1px solid #30363d; }
    .tab:hover:not(.active) { background:#21262d; color:#c9d1d9; }
    .page { padding:16px; max-width:660px; margin:0 auto; }
    .finals-row td { background:#0d2a0d !important; }
    .finals-row:hover td { background:#122e12 !important; }
    .pos-border-1 td:first-child { border-left:4px solid #d4a017; }
    .pos-border-2 td:first-child { border-left:4px solid #8b949e; }
    .pos-border-3 td:first-child { border-left:4px solid #b87333; }
    .pos-border-4 td:first-child { border-left:4px solid #3fb950; }
    .score-win { color:#3fb950; font-weight:800; }
    .score-lose { color:#f85149; font-weight:700; }
    .result-header { background:#0d2a0d; border:1px solid #2d5a2d; border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:0; }
    .form-group { margin-bottom:14px; }
    .alert { padding:10px 14px; border-radius:var(--radius-sm); font-size:13px; font-weight:600; margin-bottom:12px; }
    .alert-success { background:#0d3d0d; color:#3fb950; border:1px solid #2d5a2d; }
    .alert-error { background:#3d1a1a; color:#f85149; border:1px solid #6e1a1a; }
    .alert-info { background:#0d2a4a; color:#58a6ff; border:1px solid #1d4a7a; }
    .sub-badge { font-size:10px; background:#2d1e00; color:#d4a017; border-radius:4px; padding:1px 5px; font-weight:800; margin-left:4px; }
    .spinner { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,0.3); border-top-color:white; border-radius:50%; animation:spin 0.6s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .upload-zone { border:2px dashed #30363d; border-radius:var(--radius); padding:28px; text-align:center; cursor:pointer; transition:all 0.15s; background:#0d1117; }
    .upload-zone:hover { border-color:#3fb950; background:#0d2a0d; }
    .upload-zone input[type=file] { display:none; }
    .score-pair { display:grid; grid-template-columns:1fr 80px 1fr; align-items:center; gap:4px; padding:7px 0; border-bottom:1px solid var(--gray-border); }
    .score-pair:last-child { border-bottom:none; }
    .combo-lbl { font-size:11px; color:var(--gray); font-weight:800; text-align:center; }
    .set-score { font-size:20px; font-weight:900; text-align:center; }
    .player-name { font-size:12px; display:block; line-height:1.3; }
    .stat-highlight { background:#0d2a0d; border:1px solid #2d5a2d; border-radius:var(--radius); padding:14px; color:#e6edf3; text-align:center; }
    .stat-highlight .val { font-size:28px; font-weight:900; color:#3fb950; }
    .stat-highlight .lbl { font-size:11px; color:#8b949e; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; margin-top:2px; }
    .stat-highlight .name { font-size:14px; font-weight:800; margin-top:4px; color:#e6edf3; }
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .divider { border:none; border-top:1px solid var(--gray-border); margin:12px 0; }
    h2 { font-size:18px; font-weight:800; color:#e6edf3; margin-bottom:12px; }
    h3 { font-size:15px; font-weight:800; color:#e6edf3; margin-bottom:8px; }
    .text-green { color:#3fb950; }
    .text-red { color:#f85149; }
    .text-gray { color:#8b949e; font-size:13px; }
    .text-navy { color:#e6edf3; }
    @media(max-width:480px){
      .page { padding:10px; }
      .grid-3 { grid-template-columns:1fr 1fr; }

async function saveData(d){const full={...d,_v:SEED._v};try{localStorage.setItem("btc_v3",JSON.stringify(full));}catch(e){}try{const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json","x-admin-key":API_KEY},body:JSON.stringify(full)});if(!res.ok){const msg=await res.text().catch(()=>"");alert("Save did not reach the shared server (kept on this device only). "+msg);}}catch(e){alert("Could not reach the server — results only saved on this device. Check your connection and try again.");}}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
const COMBO_MAP={"1+2":[0,1],"3+4":[2,3],"1+3":[0,2],"2+4":[1,3],"1+4":[0,3],"2+3":[1,2]};
const TEAM_COLORS=["#58a6ff","#3fb950","#f0a500","#ff7b72","#d2a8ff","#79c0ff","#ffa657"];

function getTeam(teams,id){return teams.find(t=>t.id===id)||{id,name:"?",players:[]};}
function teamName(team){if(!team)return"?";const f=team.players[0]?.split(" ")[0];return f?`Team ${f}`:team.name;}
function tName(teams,id){return teamName(getTeam(teams,id));}
function fmtDate(iso){if(!iso)return"";const d=new Date(iso+"T00:00:00");return d.toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"});}
function isSub(teams,player,teamId){return!getTeam(teams,teamId).players.includes(player);}

function getFinalsState(data){
  const f=data.finals; if(!f)return null;
  const{qualifying:q,elimination:e,prelim:p,grandFinal:g}=f;
  if(!q||!e)return null;
  const qWinner=q.pts1>q.pts2?q.team1:q.team2;
  const qLoser=qWinner===q.team1?q.team2:q.team1;
  const eWinner=e.pts1>e.pts2?e.team1:e.team2;
  const eLoser=eWinner===e.team1?e.team2:e.team1;

  const prelimTeam1=qLoser, prelimTeam2=eWinner;
  const prelimPlayed=!!(p&&p.pts1!=null);
  const prelimWinner=prelimPlayed?(p.pts1>p.pts2?p.team1:p.team2):null;
  const prelimLoser=prelimPlayed?(prelimWinner===p.team1?p.team2:p.team1):null;

  const gfTeam1=qWinner, gfTeam2=prelimWinner;
  const gfPlayed=!!(g&&g.pts1!=null);
  const champion=gfPlayed?(g.pts1>g.pts2?g.team1:g.team2):null;
  const runnerUp=gfPlayed?(champion===g.team1?g.team2:g.team1):null;

  return{q,e,qWinner,qLoser,eWinner,eLoser,
    prelim:{...(p||{}),team1:prelimTeam1,team2:prelimTeam2,date:p?.date||"2026-06-18",played:prelimPlayed,winner:prelimWinner,loser:prelimLoser},
    grandFinal:{...(g||{}),team1:gfTeam1,team2:gfTeam2,date:g?.date||"2026-06-25",played:gfPlayed,champion,runnerUp}};
}

function calcFinalsLadder(data){
  const base=calcLadder(data);
  const fs=getFinalsState(data);
  if(!fs)return base;
  let order;
  if(fs.grandFinal.played){
    order=[fs.grandFinal.champion,fs.grandFinal.runnerUp,fs.prelim.loser,fs.eLoser];
  }else if(fs.prelim.played){
    order=[fs.qWinner,fs.prelim.winner,fs.prelim.loser,fs.eLoser];
  }else{
    order=[fs.qWinner,fs.eWinner,fs.qLoser,fs.eLoser];
  }
  const top4=order.map(id=>base.find(t=>t.id===id)).filter(Boolean);
  const rest=base.filter(t=>!order.includes(t.id));
  return[...top4,...rest];
}

function calcLadder(data,upToRound=Infinity){
  const map={};
  data.teams.forEach(t=>{map[t.id]={id:t.id,P:0,W:0,D:0,L:0,Pts:0,GF:0,GA:0,setW:0,setL:0};});
  data.results.filter(r=>r.round<=upToRound).forEach(rnd=>{
    rnd.matches.forEach(m=>{
      const r1=map[m.team1],r2=map[m.team2];
      if(!r1||!r2)return;
      r1.P++;r2.P++;
      r1.Pts+=m.pts1;r2.Pts+=m.pts2;
      r1.GF+=m.total1;r1.GA+=m.total2;
      r2.GF+=m.total2;r2.GA+=m.total1;
      if(m.pts1>m.pts2){r1.W++;r2.L++;}
      else if(m.pts2>m.pts1){r2.W++;r1.L++;}
      else{r1.D++;r2.D++;}
      m.sets.forEach(s=>{
        const lg1=Number(s.g1)||0, lg2=Number(s.g2)||0;
        if(lg1>lg2){r1.setW++;r2.setL++;}
        else if(lg2>lg1){r2.setW++;r1.setL++;}
      });
    });
  });
  return Object.values(map).sort((a,b)=>(b.Pts-a.Pts)||((b.GF/(b.GF+b.GA)||0)-(a.GF/(a.GF+a.GA)||0)));
}

function calcPlayerStats(data){
  const{teams,results}=data;
  const stats={};
  function ensure(name){
    if(!stats[name]){
      const t=teams.find(x=>x.players.includes(name));
      stats[name]={name,teamId:t?.id||null,teamName:t?teamName(t):"Casual Sub",
        W:0,L:0,gF:0,gA:0,
        subW:0,subL:0,subGF:0,subGA:0,
        pos:{1:{W:0,L:0,gF:0,gA:0},2:{W:0,L:0,gF:0,gA:0},3:{W:0,L:0,gF:0,gA:0},4:{W:0,L:0,gF:0,gA:0}},
        l3:{W:0,L:0,gF:0,gA:0}};
    }
    return stats[name];
  }
  teams.forEach(t=>t.players.forEach(p=>ensure(p)));
  const allRnds=[...results].sort((a,b)=>a.round-b.round).map(r=>r.round);
  const l3=new Set(allRnds.slice(-3));
  const COMBOS=["1+2","3+4","1+3","2+4","1+4","2+3"];
  results.forEach(rnd=>{
    const inL3=l3.has(rnd.round);
    rnd.matches.forEach(m=>{
      m.sets.forEach((s,si)=>{
        const combo=s.c||COMBOS[si];
        const idxs=COMBO_MAP[combo];
        if(!idxs)return;
        const[ia,ib]=idxs;
        // Coerce to numbers — admin inputs save values as strings
        const sg1=Number(s.g1)||0, sg2=Number(s.g2)||0;
        [
          {name:m.roster1[ia],pos:ia+1,tid:m.team1,gMe:sg1,gOp:sg2},
          {name:m.roster1[ib],pos:ib+1,tid:m.team1,gMe:sg1,gOp:sg2},
          {name:m.roster2[ia],pos:ia+1,tid:m.team2,gMe:sg2,gOp:sg1},
          {name:m.roster2[ib],pos:ib+1,tid:m.team2,gMe:sg2,gOp:sg1},
        ].forEach(({name,pos,tid,gMe,gOp})=>{
          if(!name)return;
          const st=ensure(name);
          const W=gMe>gOp?1:0,L=gOp>gMe?1:0;
          const sub=isSub(teams,name,tid);
          // Always accumulate game totals; only count W/L when set has a winner
          if(sub){
            if(W)st.subW++;if(L)st.subL++;
            st.subGF+=gMe;st.subGA+=gOp;
          } else{
            if(W)st.W++;if(L)st.L++;
            st.gF+=gMe;st.gA+=gOp;
            if(pos>=1&&pos<=4){st.pos[pos].W+=W;st.pos[pos].L+=L;st.pos[pos].gF+=gMe;st.pos[pos].gA+=gOp;}
            if(inL3){st.l3.W+=W;st.l3.L+=L;st.l3.gF+=gMe;st.l3.gA+=gOp;}
          }
        });
      });
    });
  });
  return Object.values(stats);
}

function calcPartnerStats(data){
  const{results}=data;
  const pairs={};
  function key(a,b){return[a,b].sort().join(" & ");}
  const COMBOS=["1+2","3+4","1+3","2+4","1+4","2+3"];
  results.forEach(rnd=>{
    rnd.matches.forEach(m=>{
      m.sets.forEach((s,si)=>{
        const combo=s.c||COMBOS[si];
        const idxs=COMBO_MAP[combo];
        if(!idxs)return;
        const[ia,ib]=idxs;
        const pg1=Number(s.g1)||0, pg2=Number(s.g2)||0;
        [[m.roster1[ia],m.roster1[ib],pg1,pg2],[m.roster2[ia],m.roster2[ib],pg2,pg1]].forEach(([pa,pb,gw,gl])=>{
          if(!pa||!pb)return;
          const k=key(pa,pb);
          if(!pairs[k])pairs[k]={pair:k,W:0,L:0,gF:0,gA:0};
          if(gw>gl){pairs[k].W++;pairs[k].gF+=gw;pairs[k].gA+=gl;}
          else if(gl>gw){pairs[k].L++;pairs[k].gF+=gw;pairs[k].gA+=gl;}
        });
      });
    });
  });
  return Object.values(pairs);
}

      const sg1=Number(s.g1)||0, sg2=Number(s.g2)||0;
      [
        {name:m.roster1[ia],tid:m.team1,gMe:sg1,gOp:sg2},
        {name:m.roster1[ib],tid:m.team1,gMe:sg1,gOp:sg2},
        {name:m.roster2[ia],tid:m.team2,gMe:sg2,gOp:sg1},
        {name:m.roster2[ib],tid:m.team2,gMe:sg2,gOp:sg1},
      ].forEach(({name,tid,gMe,gOp})=>{
        if(!name)return;
        const st=ensure(name,tid);
        if(gMe>gOp)st.W++;else if(gOp>gMe)st.L++;
        st.gF+=gMe;st.gA+=gOp;
      });
    });
  });
  return Object.values(stats);
}

function swPct(W,L){if(W+L===0)return null;return W/(W+L);}
function gwPct(gF,gA){if(gF+gA===0)return null;return gF/(gF+gA);}
function fmtPct(n){return n===null?"–":Math.round(n*100)+"%";}
function sortByPerf(arr,wKey="W",lKey="L",gFKey="gF",gAKey="gA"){
  return[...arr].sort((a,b)=>{
    const sa=swPct(a[wKey],a[lKey]),sb=swPct(b[wKey],b[lKey]);
    if(sb!==sa)return(sb||0)-(sa||0);
    const ga=gwPct(a[gFKey],a[gAKey]),gb=gwPct(b[gFKey],b[gAKey]);
    return(gb||0)-(ga||0);
  });
}

// ─── LADDER CHART ─────────────────────────────────────────────────────────────
function LadderChart({data, upToRound, includeFinals}){
  const allRounds=[...data.results].sort((a,b)=>a.round-b.round).map(r=>r.round);
  const rounds=upToRound ? allRounds.filter(r=>r<=upToRound) : allRounds;
  const fs=includeFinals?getFinalsState(data):null;
  const steps=rounds.length+(fs?1:0);
  if(steps<2)return<div style={{padding:16,textAlign:"center",color:"var(--gray)",fontSize:13}}>Chart available after 2 rounds with results</div>;
  const history=rounds.map(rnd=>calcLadder(data,rnd));
  if(fs)history.push(calcFinalsLadder(data));
  const W=500,H=175,PAD={t:16,b:20,l:20,r:72};
  const pw=W-PAD.l-PAD.r,ph=H-PAD.t-PAD.b;
  const xp=i=>PAD.l+i/(steps-1)*pw;
  const yp=pos=>PAD.t+(pos-1)/6*ph;
  return(
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",display:"block"}}>
      {[1,2,3,4,5,6,7].map(pos=>(
        <g key={pos}>
          <line x1={PAD.l} x2={W-PAD.r} y1={yp(pos)} y2={yp(pos)} stroke="#21262d" strokeWidth={1}/>
          <text x={PAD.l-4} y={yp(pos)+3.5} fontSize={9} fill="#484f58" textAnchor="end" fontWeight={700}>{pos}</text>
        </g>
      ))}
      {data.teams.map((team,ti)=>{
        const pts=history.map((lad,i)=>{
          const pos=lad.findIndex(l=>l.id===team.id)+1;
          return{x:xp(i),y:yp(pos),pos};
        });
        const polyPts=pts.map(p=>`${p.x},${p.y}`).join(" ");
        const last=pts[pts.length-1];
        return(
          <g key={team.id}>
            <polyline points={polyPts} fill="none" stroke={TEAM_COLORS[ti]} strokeWidth={2} strokeLinejoin="round" strokeLinecap="round"/>
            {pts.map((p,i)=><circle key={i} cx={p.x} cy={p.y} r={3} fill={TEAM_COLORS[ti]}/>)}
            <text x={last.x+6} y={last.y+4} fontSize={9} fill={TEAM_COLORS[ti]} fontWeight={800}>{teamName(team).replace("Team ","")}</text>
          </g>
        );
      })}
      {rounds.map((r,i)=>(
        <text key={r} x={xp(i)} y={H-3} fontSize={9} fill="var(--gray)" textAnchor="middle">R{r}</text>
      ))}
      {fs&&<text x={xp(rounds.length)} y={H-3} fontSize={9} fill="#3fb950" textAnchor="middle" fontWeight={800}>Finals</text>}
    </svg>
  );
}

  const hasScore=m.sets&&m.sets.length>0;
  const winnerId=hasScore?(m.pts1>m.pts2?m.team1:m.team2):m.winner;
  return(
    <div className="card" style={{padding:0,overflow:"hidden"}}>
      <div className="result-header">
        <div style={{fontSize:11,color:"rgba(255,255,255,0.6)",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}}>{label} · {fmtDate(m.date)} · Court {m.court}</div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontWeight:800,fontSize:15}}>{teamName(t1)}</div>
            {hasScore&&<div style={{fontSize:24,fontWeight:900,color:"var(--green)"}}>{m.pts1}</div>}
          </div>
          <div style={{textAlign:"center"}}>
            {hasScore?<>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.6)"}}>pts</div>
              <div style={{fontSize:13,fontWeight:700,color:"rgba(255,255,255,0.8)"}}>vs</div>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.5)"}}>{m.total1}–{m.total2} games</div>
            </>:<div style={{fontSize:13,fontWeight:700,color:"rgba(255,255,255,0.8)"}}>vs</div>}
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontWeight:800,fontSize:15}}>{teamName(t2)}</div>
            {hasScore&&<div style={{fontSize:24,fontWeight:900,color:"var(--green)"}}>{m.pts2}</div>}
          </div>
        </div>
      </div>
      <div style={{padding:"0 12px"}}>

          const p2a=m.roster2[idxs[0]],p2b=m.roster2[idxs[1]];

          return(
            <div key={i} className="score-pair">

function TeamsPage({data}){
  const[sel,setSel]=useState(1);
  const ladder=useMemo(()=>calcLadder(data),[data]);
  const playerStats=useMemo(()=>calcPlayerStats(data),[data]);
  const team=getTeam(data.teams,sel);
  const teamLadder=ladder.find(t=>t.id===sel)||{};
  const pos=ladder.findIndex(t=>t.id===sel)+1;
  const sp=swPct(teamLadder.setW||0,teamLadder.setL||0);
  const gp=teamLadder.GF&&teamLadder.GA?teamLadder.GF/(teamLadder.GF+teamLadder.GA):null;
  const nextFix=data.fixtures.find(f=>{
    const hasRes=data.results.find(r=>r.round===f.round);
    return!hasRes&&f.matches.some(m=>m.t1===sel||m.t2===sel);
  });
  const nextOpp=nextFix?nextFix.matches.find(m=>m.t1===sel||m.t2===sel):null;
  const nextOppId=nextOpp?(nextOpp.t1===sel?nextOpp.t2:nextOpp.t1):null;

  return(
    <div className="page">

            {label:"Elimination Final",date:fmtDate(fs.e.date),detail:`${tName(data.teams,fs.eWinner)} def ${tName(data.teams,fs.eLoser)}${fs.e.total1!=null?` ${fs.e.total1}–${fs.e.total2}`:""} — through to Preliminary Final`},
            {label:"Preliminary Final",date:fmtDate(fs.prelim.date),detail:fs.prelim.played?`${tName(data.teams,fs.prelim.winner)} def ${tName(data.teams,fs.prelim.loser)}${fs.prelim.total1!=null?` ${fs.prelim.total1}–${fs.prelim.total2}`:""} — through to Grand Final`:`${tName(data.teams,fs.prelim.team1)} v ${tName(data.teams,fs.prelim.team2)}`},
            {label:"Grand Final",date:fmtDate(fs.grandFinal.date),detail:fs.grandFinal.played?`🏆 ${tName(data.teams,fs.grandFinal.champion)} def ${tName(data.teams,fs.grandFinal.runnerUp)}${fs.grandFinal.total1!=null?` ${fs.grandFinal.total1}–${fs.grandFinal.total2}`:""} — Premiers!`:fs.grandFinal.team2!=null?`${tName(data.teams,fs.grandFinal.team1)} v ${tName(data.teams,fs.grandFinal.team2)}`:`${tName(data.teams,fs.grandFinal.team1)} v Winner Prelim`},
          ]:[
            {label:"Elimination & Qualifying",date:"11 Jun 2026",detail:`${n(2)} v ${n(3)}  •  ${n(0)} v ${n(1)}`},
            {label:"Preliminary Final",date:"18 Jun 2026",detail:`Loser ${n(0)}/${n(1)} v Winner ${n(2)}/${n(3)}`},

function ScoreEntry({data,setData}){
  const{fixtures,results,teams}=data;
  const available=fixtures.filter(f=>!results.find(r=>r.round===f.round));
  const[mode,setMode]=useState("new");
  const[selRound,setSelRound]=useState(available[0]?.round||null);
  const[editRound,setEditRound]=useState(results[results.length-1]?.round||null);
  const[matches,setMatches]=useState([]);
  const[imageLoading,setImageLoading]=useState(false);
  const[imageResult,setImageResult]=useState(null);
  const[msg,setMsg]=useState(null);
  const fileRef=useRef();

  function initMatches(fixtureRound,existing){
    return fixtureRound.matches.map(m=>{
      const ex=existing?.matches.find(r=>r.team1===m.t1&&r.team2===m.t2);
      const t1=getTeam(teams,m.t1),t2=getTeam(teams,m.t2);
      return{
        team1:m.t1,team2:m.t2,
        roster1:ex?.roster1||[...t1.players],
        roster2:ex?.roster2||[...t2.players],
        sets:ex?.sets||["1+2","3+4","1+3","2+4","1+4","2+3"].map(c=>({c,g1:"",g2:""})),
        pts1:ex?.pts1||0,pts2:ex?.pts2||0,total1:ex?.total1||0,total2:ex?.total2||0,
      };
    });
  }

  useEffect(()=>{
    const rndNum=mode==="new"?selRound:editRound;
    const r=fixtures.find(f=>f.round===rndNum);
    const ex=mode==="edit"?results.find(r2=>r2.round===rndNum):null;
    if(r)setMatches(initMatches(r,ex));
  },[selRound,editRound,mode]);

  function updScore(mi,si,field,val){
    setMatches(prev=>prev.map((m,i)=>{
      if(i!==mi)return m;
      const newSets=m.sets.map((s,j)=>j===si?{...s,[field]:val}:s);
      const filled=newSets.every(s=>s.g1!==""&&s.g2!=="");
      if(!filled)return{...m,sets:newSets};
      let setW1=0,setW2=0,g1=0,g2=0;
      newSets.forEach(s=>{const a=Number(s.g1),b=Number(s.g2);if(a>b)setW1++;else setW2++;g1+=a;g2+=b;});
      let pts1,pts2;
      if(setW1>setW2){pts1=setW1+2;pts2=setW2;}
      else if(setW2>setW1){pts2=setW2+2;pts1=setW1;}
      else if(g1>g2){pts1=setW1+2;pts2=setW2;}
      else if(g2>g1){pts2=setW2+2;pts1=setW1;}
      else{pts1=setW1+1;pts2=setW2+1;}
      return{...m,sets:newSets,total1:g1,total2:g2,pts1,pts2};
    }));
  }

  function updRoster(mi,side,pi,val){
    setMatches(prev=>prev.map((m,i)=>i!==mi?m:{...m,[side==="1"?"roster1":"roster2"]:m[side==="1"?"roster1":"roster2"].map((p,j)=>j===pi?val:p)}));
  }

  function handleSave(){
    const rndNum=mode==="new"?selRound:editRound;
    const newResult={round:rndNum,matches};
    const newResults=mode==="new"?[...results,newResult].sort((a,b)=>a.round-b.round):results.map(r=>r.round===rndNum?newResult:r);
    const updated={...data,results:newResults};
    setData(updated);saveData(updated);
    setMsg({type:"success",text:`Round ${rndNum} saved!`});
    setTimeout(()=>setMsg(null),3000);
  }

  async function handleImage(e){
    const file=e.target.files[0];
    if(!file||!data.anthropicKey){setMsg({type:"error",text:"Set your Anthropic API key in Settings first."});return;}
    setImageLoading(true);setMsg(null);
    try{
      const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});
      const resp=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"x-api-key":data.anthropicKey,"anthropic-version":"2023-06-01","content-type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-opus-4-6",max_tokens:2048,messages:[{role:"user",content:[
          {type:"image",source:{type:"base64",media_type:file.type||"image/jpeg",data:b64}},
          {type:"text",text:`Extract tennis scoresheet data. Return ONLY a JSON array of match objects, each with:
- team1Name, team2Name (strings)
- roster1, roster2 (arrays of 4 player name strings)
- sets: array of 6 objects [{c:"1+2",g1:number,g2:number},{c:"3+4",...},{c:"1+3",...},{c:"2+4",...},{c:"1+4",...},{c:"2+3",...}]
  where g1=team1 games, g2=team2 games for that combination
- total1, total2 (total games), pts1, pts2 (competition points)
Return ONLY the JSON array, no other text.`}
        ]}]})
      });
      const json=await resp.json();
      const text=json.content?.[0]?.text||"";
      setImageResult(JSON.parse(text.trim()));
      setMsg({type:"success",text:"✅ Scores extracted! Click Apply to fill in the form."});
    }catch(ex){setMsg({type:"error",text:`Error: ${ex.message}`});}
    finally{setImageLoading(false);if(fileRef.current)fileRef.current.value="";}
  }

  function applyImage(){
    if(!imageResult)return;
    setMatches(prev=>prev.map(m=>{
      const t1n=teamName(getTeam(teams,m.team1)).toLowerCase();
      const found=imageResult.find(r=>{
        const r1=r.team1Name?.toLowerCase()||"",r2=r.team2Name?.toLowerCase()||"";
        return r1.includes(t1n.replace("team ",""))||t1n.includes(r1.replace("team ",""))||r2.includes(t1n.replace("team ",""))||t1n.includes(r2.replace("team ",""));
      });
      if(!found)return m;
      const flip=!(found.team1Name?.toLowerCase().includes(t1n.replace("team ","")));
      return{...m,
        roster1:flip?found.roster2:found.roster1||m.roster1,
        roster2:flip?found.roster1:found.roster2||m.roster2,
        sets:found.sets||m.sets,
        total1:flip?found.total2:found.total1,total2:flip?found.total1:found.total2,
        pts1:flip?found.pts2:found.pts1,pts2:flip?found.pts1:found.pts2,
      };
    }));
    setImageResult(null);setMsg({type:"success",text:"Applied. Review then save."});
  }

  const rndNum=mode==="new"?selRound:editRound;
  const round=fixtures.find(f=>f.round===rndNum);

  return(
    <div>
      <div className="card">
        <div style={{display:"flex",gap:8,marginBottom:12}}>
          <button className={`btn btn-sm ${mode==="new"?"btn-primary":"btn-secondary"}`} onClick={()=>setMode("new")}>New Round</button>
          <button className={`btn btn-sm ${mode==="edit"?"btn-primary":"btn-secondary"}`} onClick={()=>setMode("edit")}>Edit Existing</button>
        </div>
        {mode==="new"?(
          <div className="form-group">
            <label>Select Round</label>
            <select value={selRound||""} onChange={e=>setSelRound(Number(e.target.value))}>
              {available.map(f=><option key={f.round} value={f.round}>Round {f.round} – {fmtDate(f.date)}</option>)}
            </select>
          </div>
        ):(
          <div className="form-group">
            <label>Select Round to Edit</label>
            <select value={editRound||""} onChange={e=>setEditRound(Number(e.target.value))}>
              {results.map(r=><option key={r.round} value={r.round}>Round {r.round}</option>)}
            </select>
          </div>
        )}
      </div>

      {data.anthropicKey&&(
        <div className="card">
          <h3 style={{marginBottom:8}}>📷 Upload Score Sheet Photo</h3>
          <div className="upload-zone" onClick={()=>fileRef.current?.click()}>
            <input ref={fileRef} type="file" accept="image/*" onChange={handleImage}/>
            {imageLoading?<div><div style={{fontSize:24}}>⏳</div><div style={{marginTop:8,color:"var(--gray)"}}>Reading scores with AI...</div></div>:(
              <div><div style={{fontSize:32}}>📷</div><div style={{fontWeight:700,marginTop:8,color:"#e6edf3"}}>Tap to upload score sheet</div><div style={{fontSize:12,color:"var(--gray)",marginTop:4}}>Claude reads the scores automatically</div></div>
            )}
          </div>
          {imageResult&&<button className="btn btn-green" style={{width:"100%",marginTop:8}} onClick={applyImage}>Apply Extracted Scores →</button>}
        </div>
      )}
      {!data.anthropicKey&&<div className="alert alert-info">💡 Add your Anthropic API key in Settings to enable photo score entry.</div>}
      {msg&&<div className={`alert alert-${msg.type}`}>{msg.text}</div>}

      {!round&&<div className="card" style={{textAlign:"center",color:"var(--gray)",padding:20}}>All rounds have results. Use "Edit Existing" to make changes.</div>}

      {matches.map((m,mi)=>{
        const t1=getTeam(teams,m.team1),t2=getTeam(teams,m.team2);
        const filled=m.sets.every(s=>s.g1!==""&&s.g2!=="");
        return(
          <div key={mi} className="card">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <h3 style={{margin:0}}>{teamName(t1)} vs {teamName(t2)}</h3>
              {filled&&<span style={{fontWeight:900,color:"var(--green-dark)"}}>{m.pts1}–{m.pts2}</span>}
            </div>
            <div className="grid-2" style={{marginBottom:12}}>
              {[[t1,m.team1,"1"],[t2,m.team2,"2"]].map(([t,tid,side])=>(
                <div key={side}>
                  <label style={{color:"var(--green-dark)"}}>{teamName(t)} Roster</label>
                  {(side==="1"?m.roster1:m.roster2).map((p,pi)=>(
                    <div key={pi} style={{marginBottom:4}}>
                      <input value={p} onChange={e=>updRoster(mi,side,pi,e.target.value)} placeholder={`Player ${pi+1}`} style={{fontSize:13}}/>
                    </div>
                  ))}
                </div>
              ))}
            </div>
            <div style={{overflowX:"auto"}}>
              <table style={{minWidth:280}}>
                <thead><tr><th>Combo</th><th style={{textAlign:"center"}}>{teamName(t1)}</th><th style={{textAlign:"center"}}>{teamName(t2)}</th><th style={{textAlign:"center",width:70}}>Winner</th></tr></thead>
                <tbody>
                  {m.sets.map((s,si)=>{
                    const g1=Number(s.g1),g2=Number(s.g2);
                    const w=s.g1!==""&&s.g2!==""?(g1>g2?teamName(t1):g2>g1?teamName(t2):""):"";
                    return(
                      <tr key={si}>
                        <td style={{fontWeight:800,fontSize:13}}>{s.c}</td>
                        <td style={{padding:"3px 6px"}}><input type="number" min="0" max="9" value={s.g1} onChange={e=>updScore(mi,si,"g1",e.target.value)} style={{textAlign:"center",padding:4}}/></td>
                        <td style={{padding:"3px 6px"}}><input type="number" min="0" max="9" value={s.g2} onChange={e=>updScore(mi,si,"g2",e.target.value)} style={{textAlign:"center",padding:4}}/></td>
                        <td style={{textAlign:"center",fontSize:11,fontWeight:800,color:w===teamName(t1)?"var(--green-dark)":w?"var(--red)":"var(--gray)"}}>{w?`✓ ${w.split(" ")[1]}`:""}</td>
                      </tr>
                    );
                  })}
                </tbody>
                {filled&&<tfoot><tr style={{background:"#21262d"}}><td style={{fontWeight:800,color:"#e6edf3"}}>Total</td><td style={{textAlign:"center",fontWeight:900,color:"#e6edf3"}}>{m.total1}</td><td style={{textAlign:"center",fontWeight:900,color:"#e6edf3"}}>{m.total2}</td><td style={{textAlign:"center",fontWeight:900,color:"#3fb950"}}>{m.pts1}–{m.pts2}</td></tr></tfoot>}
              </table>
            </div>
          </div>
        );
      })}
      {round&&<button className="btn btn-primary" style={{width:"100%",padding:14,fontSize:16,marginTop:4}} onClick={handleSave}>💾 Save Round {rndNum} Results</button>}
    </div>
  );
}

function FinalsScoreEntry({data,setData}){
  const{teams}=data;
  const STAGES=[
    {key:"qualifying",label:"Qualifying Final"},
    {key:"elimination",label:"Elimination Final"},
    {key:"prelim",label:"Preliminary Final"},
    {key:"grandFinal",label:"Grand Final"},
  ];
  const[stage,setStage]=useState("qualifying");
  const[msg,setMsg]=useState(null);
  const fs=getFinalsState(data);

  function teamsForStage(stageKey){
    if(stageKey==="qualifying")return[data.finals.qualifying?.team1,data.finals.qualifying?.team2];
    if(stageKey==="elimination")return[data.finals.elimination?.team1,data.finals.elimination?.team2];
    if(stageKey==="prelim")return[fs?.prelim?.team1,fs?.prelim?.team2];
    if(stageKey==="grandFinal")return[fs?.grandFinal?.team1,fs?.grandFinal?.team2];
    return[null,null];
  }

  function initMatch(stageKey){
    const existing=data.finals[stageKey];
    const[team1,team2]=teamsForStage(stageKey);
    if(team1==null||team2==null)return null;
    const t1=getTeam(teams,team1),t2=getTeam(teams,team2);
    const defDate=stageKey==="prelim"?"2026-06-18":stageKey==="grandFinal"?"2026-06-25":existing?.date;
    return{
      team1,team2,
      label:existing?.label||STAGES.find(s=>s.key===stageKey).label,
      date:existing?.date||defDate,
      court:existing?.court||"",
      roster1:existing?.roster1||[...t1.players],
      roster2:existing?.roster2||[...t2.players],
      sets:existing?.sets||["1+2","3+4","1+3","2+4","1+4","2+3"].map(c=>({c,g1:"",g2:""})),
      pts1:existing?.pts1||0,pts2:existing?.pts2||0,total1:existing?.total1||0,total2:existing?.total2||0,
    };
  }

  const[m,setM]=useState(()=>initMatch(stage));
  useEffect(()=>{setM(initMatch(stage));},[stage,data]);

  function updScore(si,field,val){
    setM(prev=>{
      const newSets=prev.sets.map((s,j)=>j===si?{...s,[field]:val}:s);
      const filled=newSets.every(s=>s.g1!==""&&s.g2!=="");
      if(!filled)return{...prev,sets:newSets};
      let setW1=0,setW2=0,g1=0,g2=0;
      newSets.forEach(s=>{const a=Number(s.g1),b=Number(s.g2);if(a>b)setW1++;else setW2++;g1+=a;g2+=b;});
      let pts1,pts2;
      if(setW1>setW2){pts1=setW1+2;pts2=setW2;}
      else if(setW2>setW1){pts2=setW2+2;pts1=setW1;}
      else if(g1>g2){pts1=setW1+2;pts2=setW2;}
      else if(g2>g1){pts2=setW2+2;pts1=setW1;}
      else{pts1=setW1+1;pts2=setW2+1;}
      return{...prev,sets:newSets,total1:g1,total2:g2,pts1,pts2};
    });
  }

  function updRoster(side,pi,val){
    setM(prev=>({...prev,[side==="1"?"roster1":"roster2"]:prev[side==="1"?"roster1":"roster2"].map((p,j)=>j===pi?val:p)}));
  }

  function handleSave(){
    const newFinals={...data.finals,[stage]:{...m}};
    const updated={...data,finals:newFinals};
    setData(updated);saveData(updated);
    setMsg({type:"success",text:`${m.label} saved!`});
    setTimeout(()=>setMsg(null),3000);
  }

  return(
    <div>
      <div className="card">
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {STAGES.map(s=>(
            <button key={s.key} className={`btn btn-sm ${stage===s.key?"btn-primary":"btn-secondary"}`} onClick={()=>setStage(s.key)}>{s.label}</button>
          ))}
        </div>
      </div>
      {msg&&<div className={`alert alert-${msg.type}`}>{msg.text}</div>}
      {!m&&(
        <div className="card" style={{textAlign:"center",color:"var(--gray)",padding:20}}>
          {stage==="grandFinal"?"Grand Final teams aren't determined yet — enter the Preliminary Final result first.":"This stage isn't ready yet."}
        </div>
      )}
      {m&&(()=>{
        const t1=getTeam(teams,m.team1),t2=getTeam(teams,m.team2);
        const filled=m.sets.every(s=>s.g1!==""&&s.g2!=="");
        return(
          <div className="card">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <h3 style={{margin:0}}>{teamName(t1)} vs {teamName(t2)}</h3>
              {filled&&<span style={{fontWeight:900,color:"var(--green-dark)"}}>{m.pts1}–{m.pts2}</span>}
            </div>
            <div className="grid-2" style={{gap:12,marginBottom:12}}>
              <div className="form-group" style={{marginBottom:0}}>
                <label>Date</label>
                <input type="date" value={m.date||""} onChange={e=>setM(prev=>({...prev,date:e.target.value}))}/>
              </div>
              <div className="form-group" style={{marginBottom:0}}>
                <label>Court</label>
                <input value={m.court||""} onChange={e=>setM(prev=>({...prev,court:e.target.value}))} placeholder="e.g. 3 & 4"/>
              </div>
            </div>
            <div className="grid-2" style={{marginBottom:12}}>
              {[[t1,m.team1,"1"],[t2,m.team2,"2"]].map(([t,tid,side])=>(
                <div key={side}>
                  <label style={{color:"var(--green-dark)"}}>{teamName(t)} Roster</label>
                  {(side==="1"?m.roster1:m.roster2).map((p,pi)=>(
                    <div key={pi} style={{marginBottom:4}}>
                      <input value={p} onChange={e=>updRoster(side,pi,e.target.value)} placeholder={`Player ${pi+1}`} style={{fontSize:13}}/>
                    </div>
                  ))}
                </div>
              ))}
            </div>
            <div style={{overflowX:"auto"}}>
              <table style={{minWidth:280}}>
                <thead><tr><th>Combo</th><th style={{textAlign:"center"}}>{teamName(t1)}</th><th style={{textAlign:"center"}}>{teamName(t2)}</th><th style={{textAlign:"center",width:70}}>Winner</th></tr></thead>
                <tbody>
                  {m.sets.map((s,si)=>{
                    const g1=Number(s.g1),g2=Number(s.g2);
                    const w=s.g1!==""&&s.g2!==""?(g1>g2?teamName(t1):g2>g1?teamName(t2):""):"";
                    return(
                      <tr key={si}>
                        <td style={{fontWeight:800,fontSize:13}}>{s.c}</td>
                        <td style={{padding:"3px 6px"}}><input type="number" min="0" max="9" value={s.g1} onChange={e=>updScore(si,"g1",e.target.value)} style={{textAlign:"center",padding:4}}/></td>
                        <td style={{padding:"3px 6px"}}><input type="number" min="0" max="9" value={s.g2} onChange={e=>updScore(si,"g2",e.target.value)} style={{textAlign:"center",padding:4}}/></td>
                        <td style={{textAlign:"center",fontSize:11,fontWeight:800,color:w===teamName(t1)?"var(--green-dark)":w?"var(--red)":"var(--gray)"}}>{w?`✓ ${w.split(" ")[1]}`:""}</td>
                      </tr>
                    );
                  })}
                </tbody>
                {filled&&<tfoot><tr style={{background:"#21262d"}}><td style={{fontWeight:800,color:"#e6edf3"}}>Total</td><td style={{textAlign:"center",fontWeight:900,color:"#e6edf3"}}>{m.total1}</td><td style={{textAlign:"center",fontWeight:900,color:"#e6edf3"}}>{m.total2}</td><td style={{textAlign:"center",fontWeight:900,color:"#3fb950"}}>{m.pts1}–{m.pts2}</td></tr></tfoot>}
              </table>
            </div>
            <button className="btn btn-primary" style={{width:"100%",padding:14,fontSize:16,marginTop:12}} onClick={handleSave}>💾 Save {m.label}</button>
          </div>
        );
      })()}
    </div>
  );
}

function RosterAdmin({data,setData}){
  const{fixtures,results,teams}=data;
  const nextRound=fixtures.find(f=>!results.find(r=>r.round===f.round));
  const[selRound,setSelRound]=useState(nextRound?.round||fixtures[0]?.round);
  const[rosters,setRosters]=useState({});
  const[msg,setMsg]=useState(null);
  const round=fixtures.find(f=>f.round===selRound);
  useEffect(()=>{
    const r=fixtures.find(f=>f.round===selRound);
    if(!r)return;
    const existing=data.results.find(res=>res.round===selRound);
    const init={};
    r.matches.forEach(m=>{
      const ex=existing?.matches.find(mr=>mr.team1===m.t1&&mr.team2===m.t2);
      init[`${m.t1}`]=ex?.roster1||[...getTeam(teams,m.t1).players];
      init[`${m.t2}`]=ex?.roster2||[...getTeam(teams,m.t2).players];
    });
    setRosters(init);
  },[selRound]);

  const byeTeam=round?getTeam(teams,round.bye):{players:[]};

  function setPlayer(tid,idx,val){
    setRosters(prev=>{const arr=[...(prev[tid]||["","","",""])];arr[idx]=val;return{...prev,[tid]:arr};});
  }

  function handleSave(){
    const newRosters={...(data.rosters||{}),[selRound]:rosters};
    const updated={...data,rosters:newRosters};setData(updated);saveData(updated);
    setMsg({type:"success",text:"Roster saved!"});setTimeout(()=>setMsg(null),3000);
  }

  function genAnnouncement(){
    if(!round)return;
    let txt=`🎾 Berwick TC – Men's Night Comp\nRound ${round.round} – ${fmtDate(round.date)}\n\n`;
    round.matches.forEach(m=>{
      const t1=getTeam(teams,m.t1),t2=getTeam(teams,m.t2);
      const r1=rosters[`${m.t1}`]||t1.players;
      const r2=rosters[`${m.t2}`]||t2.players;
      txt+=`${teamName(t1)} vs ${teamName(t2)}\n`;
      r1.forEach((p,i)=>txt+=`  ${teamName(t1)} Pos ${i+1}: ${p}${isSub(teams,p,m.t1)?" ⭐ sub":""}\n`);
      r2.forEach((p,i)=>txt+=`  ${teamName(t2)} Pos ${i+1}: ${p}${isSub(teams,p,m.t2)?" ⭐ sub":""}\n`);
      txt+="\n";
    });
    txt+=`Bye: ${tName(teams,round.bye)}`;
    navigator.clipboard?.writeText(txt);
    setMsg({type:"success",text:"Announcement copied to clipboard! Paste into WhatsApp/email."});
    setTimeout(()=>setMsg(null),4000);
  }

  return(
    <div>
      <div className="card">
        <div className="form-group">
          <label>Round</label>
          <select value={selRound||""} onChange={e=>setSelRound(Number(e.target.value))}>
            {fixtures.map(f=><option key={f.round} value={f.round}>Round {f.round} – {fmtDate(f.date)}</option>)}
          </select>
        </div>
        {round&&<div style={{fontSize:12,color:"var(--gray)"}}>Bye team: <strong>{tName(teams,round.bye)}</strong> (their players available as subs)</div>}
      </div>
      {msg&&<div className={`alert alert-${msg.type}`}>{msg.text}</div>}
      {round&&round.matches.map(m=>{
        const t1=getTeam(teams,m.t1),t2=getTeam(teams,m.t2);
        return(
          <div key={`${m.t1}-${m.t2}`} className="card">
            <h3 style={{marginBottom:10}}>{teamName(t1)} vs {teamName(t2)}</h3>
            <div className="grid-2">
              {[[t1,m.t1],[t2,m.t2]].map(([t,tid])=>{
                const roster=rosters[`${tid}`]||[...t.players];
                return(
                  <div key={tid}>
                    <label style={{color:"var(--green-dark)",marginBottom:6}}>{teamName(t)}</label>
                    {[0,1,2,3].map(pi=>{
                      const p=roster[pi]||"";
                      const sub=p&&isSub(teams,p,tid);
                      return(
                        <div key={pi} style={{marginBottom:6}}>
                          <div style={{fontSize:11,color:"var(--gray)",marginBottom:2}}>Pos {pi+1}</div>
                          <select value={p} onChange={e=>setPlayer(`${tid}`,pi,e.target.value)}
                            style={{fontSize:13,borderColor:sub?"var(--gold)":"var(--gray-border)"}}>
                            <option value="">– select –</option>
                            <optgroup label="Team Players">{t.players.map(pl=><option key={pl} value={pl}>{pl}</option>)}</optgroup>
                            <optgroup label={`Bye – ${teamName(byeTeam)}`}>{byeTeam.players.map(pl=><option key={pl} value={pl}>{pl}</option>)}</optgroup>
                            <optgroup label="Casual Subs">{data.casualSubs.map(pl=><option key={pl} value={pl}>{pl}</option>)}</optgroup>
                          </select>
                          {sub&&<span className="sub-badge">SUB</span>}
                        </div>
                      );
                    })}
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
      <div style={{display:"flex",gap:8}}>
        <button className="btn btn-primary" style={{flex:1,padding:12}} onClick={handleSave}>💾 Save Rosters</button>
        <button className="btn btn-secondary" style={{flex:1,padding:12}} onClick={genAnnouncement}>📋 Copy Announcement</button>
      </div>
    </div>
  );
}

function TeamsAdmin({data,setData}){
  const[teams,setTeams]=useState(()=>data.teams.map(t=>({...t,players:[...t.players]})));
  const[msg,setMsg]=useState(null);
  function save(){const updated={...data,teams};setData(updated);saveData(updated);setMsg({type:"success",text:"Teams saved!"});setTimeout(()=>setMsg(null),3000);}
  return(
    <div>
      {msg&&<div className={`alert alert-${msg.type}`}>{msg.text}</div>}
      {teams.map((t,ti)=>(
        <div key={t.id} className="card">
          <div style={{fontWeight:800,color:"#e6edf3",marginBottom:10,fontSize:14}}>
            {teamName(t)} <span style={{color:"var(--gray)",fontWeight:400,fontSize:12}}>(Team {t.id})</span>
          </div>
          {t.players.map((p,pi)=>(
            <div key={pi} style={{display:"flex",gap:8,alignItems:"center",marginBottom:6}}>
              <span style={{fontSize:12,color:"var(--gray)",width:50,flexShrink:0}}>Pos {pi+1}</span>
              <input value={p} onChange={e=>setTeams(prev=>prev.map((x,i)=>i!==ti?x:{...x,players:x.players.map((pp,j)=>j===pi?e.target.value:pp)}))} style={{fontSize:13}}/>
            </div>
          ))}
        </div>
      ))}
      <button className="btn btn-primary" style={{width:"100%",padding:12}} onClick={save}>💾 Save Teams</button>
    </div>
  );
}

function SubsAdmin({data,setData}){
  const[subs,setSubs]=useState([...data.casualSubs]);
  const[newSub,setNewSub]=useState("");
  const[msg,setMsg]=useState(null);
  function add(){if(!newSub.trim())return;setSubs(p=>[...p,newSub.trim()]);setNewSub("");}
  function save(){const updated={...data,casualSubs:subs};setData(updated);saveData(updated);setMsg({type:"success",text:"Saved!"});setTimeout(()=>setMsg(null),3000);}
  return(
    <div>
      {msg&&<div className={`alert alert-${msg.type}`}>{msg.text}</div>}
      <div className="card">
        <h3 style={{marginBottom:10}}>Casual Substitutes</h3>
        {subs.map((s,i)=>(
          <div key={i} style={{display:"flex",gap:8,alignItems:"center",marginBottom:6}}>
            <input value={s} onChange={e=>setSubs(p=>p.map((x,j)=>j===i?e.target.value:x))} style={{fontSize:13}}/>
            <button className="btn btn-danger btn-sm" onClick={()=>setSubs(p=>p.filter((_,j)=>j!==i))}>✕</button>
          </div>
        ))}
        <div style={{display:"flex",gap:8,marginTop:10}}>
          <input value={newSub} onChange={e=>setNewSub(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()} placeholder="Add substitute name" style={{fontSize:13}}/>
          <button className="btn btn-green btn-sm" onClick={add}>Add</button>
        </div>
      </div>
      <button className="btn btn-primary" style={{width:"100%",padding:12}} onClick={save}>💾 Save</button>
    </div>
  );
}

function Settings({data,setData}){
  const[pw,setPw]=useState(data.adminPassword);
  const[key,setKey]=useState(data.anthropicKey||"");
  const[msg,setMsg]=useState(null);
  const importRef=useRef();

  function save(){const updated={...data,adminPassword:pw,anthropicKey:key};setData(updated);saveData(updated);setMsg({type:"success",text:"Settings saved!"});setTimeout(()=>setMsg(null),3000);}

  function exportData(){
    const json=JSON.stringify(data,null,2);
    const blob=new Blob([json],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=`btc-data-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    setMsg({type:"success",text:"Data exported! Save this file as a backup."});
    setTimeout(()=>setMsg(null),4000);
  }

  function importData(e){
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const parsed=JSON.parse(ev.target.result);
        if(!parsed.teams||!parsed.fixtures)throw new Error("Invalid data file");
        setData(parsed);saveData(parsed);
        setMsg({type:"success",text:"Data imported successfully!"});
        setTimeout(()=>setMsg(null),3000);
      }catch(err){setMsg({type:"error",text:"Import failed: "+err.message});}
    };
    reader.readAsText(file);
    if(importRef.current)importRef.current.value="";
  }

  return(
    <div>
      {msg&&<div className={`alert alert-${msg.type}`}>{msg.text}</div>}

      {/* Export / Import */}
      <div className="card" style={{border:"2px solid var(--navy-border)"}}>
        <h3 style={{marginBottom:4}}>💾 Backup &amp; Restore</h3>
        <div style={{fontSize:12,color:"var(--gray)",marginBottom:12}}>Export your data as a file. Import to restore from a backup — useful if you ever clear your browser or switch devices.</div>
        <div style={{display:"flex",gap:8}}>
          <button className="btn btn-primary" style={{flex:1}} onClick={exportData}>⬇️ Export Data</button>
          <button className="btn btn-secondary" style={{flex:1}} onClick={()=>importRef.current?.click()}>⬆️ Import Data</button>
          <input ref={importRef} type="file" accept=".json" style={{display:"none"}} onChange={importData}/>
        </div>
      </div>

      <div className="card">
        <div className="form-group">
          <label>Admin Password</label>
          <input type="password" value={pw} onChange={e=>setPw(e.target.value)}/>
        </div>
        <div className="form-group">
          <label>Anthropic API Key <span className="badge badge-gold">Enables photo score entry</span></label>
          <input type="password" value={key} onChange={e=>setKey(e.target.value)} placeholder="sk-ant-api..."/>
          <div style={{fontSize:12,color:"var(--gray)",marginTop:4}}>Get at <strong>console.anthropic.com</strong> → API Keys. Free $5 credit to start.</div>
        </div>
        <button className="btn btn-primary" style={{width:"100%",padding:12}} onClick={save}>💾 Save Settings</button>
      </div>
      <div className="card" style={{border:"1px solid #6e1a1a",background:"#1a0a0a"}}>
        <h3 style={{color:"var(--red)",marginBottom:8}}>Danger Zone</h3>
        <button className="btn btn-danger" style={{width:"100%"}} onClick={()=>{if(!confirm("Reset ALL data to defaults?"))return;const f=JSON.parse(JSON.stringify(SEED));setData(f);saveData(f);setMsg({type:"success",text:"Reset."});}}>Reset All Data</button>
      </div>
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App(){
  const[data,setData]=useState(()=>JSON.parse(JSON.stringify(SEED)));const[loading,setLoading]=useState(true);useEffect(()=>{let alive=true;loadData().then(d=>{if(alive){setData(d);setLoading(false);}});return()=>{alive=false;};},[]);
  const[page,setPage]=useState("home");
  const[navRound,setNavRound]=useState(null);

  function navigate(p,opts={}){
    setPage(p);
    if(opts.round!=null)setNavRound(opts.round);
  }

  return(
    <div>
      <Header page={page} setPage={setPage}/>
      {page==="home"&&<HomePage data={data}/>}
      {page==="results"&&<ResultsPage data={data} navRound={navRound} clearNavRound={()=>setNavRound(null)}/>}
      {page==="stats"&&<StatsPage data={data}/>}
      {page==="teams"&&<TeamsPage data={data}/>}
      {page==="fixtures"&&<FixturesPage data={data} navigate={navigate} ladder={calcLadder(data)}/>}
      {page==="admin"&&<AdminPage data={data} setData={setData}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
